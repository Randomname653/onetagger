[package]
name = "onetagger-identify"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
anyhow = "1.0"
serde_json = "1.0"
lazy_static = "1.5"
rusty-chromaprint = "0.3"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }

onetagger-player = { path = "../onetagger-player" }
base64 = "0.22"
onetagger-shared = { path = "../onetagger-shared" }
onetagger-autotag = { path = "../onetagger-autotag" }
regex = "1.11"
strsim = "0.11"
unidecode = "0.3"
crossbeam-channel = "0.5"
onetagger-tag = { path = "../onetagger-tag" }
metaflac = "0.2.8"
mp4ameta = "0.13"
chrono = "0.4"
lofty = "0.22"
